[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decentralised-art-mcp"
version = "0.2.0"
description = "Core decentralised.art protocol tools for simulation, publication, and onchain execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "eth-account>=0.13.0",
  "jsonschema>=4.23.0,<5",
  # This server uses the v1 low-level API, including ReadResourceContents.
  "mcp>=1.27.0,<2",
]

[project.optional-dependencies]
dev = ["PyYAML>=6.0,<7"]

[project.scripts]
decentralised-art-mcp = "decentralised_art_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"decentralised_art_mcp" = ["resources/**/*.md", "resources/**/*.txt", "resources/**/*.json", "generated/*.json"]
